name: sync-shop-page

# 每天自動重抓 BOOTH / pictSPACE，更新 index.html 並發佈
on:
  push:
    paths:
      - '.github/workflows/sync-shop-page.yml'
      - 'build.py'
      - 'index.template.html'
      - 'split_products.py'
  schedule:
    # 每 6 小時同步一次，避免過度觸發造成工作排隊
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-shop-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache thumbnails
        uses: actions/cache@v4
        with:
          path: .imgcache
          key: imgcache-${{ github.run_id }}
          restore-keys: |
            imgcache-

      - name: Ensure curl & ffmpeg
        run: |
          if ! command -v curl >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg curl
          fi

      - name: Build shop page
        run: python3 build.py

      - name: Split product markup into asynchronous batches
        run: python3 split_products.py

      - name: Commit & push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html products/
          if git diff --staged --quiet; then
            echo "No change."
          else
            git commit -m "auto sync products $(date -u +'%Y-%m-%d %H:%M UTC')"
            # GitHub 偶發 refs 更新錯誤時重試，並先同步遠端避免覆蓋新提交。
            for attempt in 1 2 3 4 5; do
              if git push origin HEAD:main; then
                exit 0
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Push failed after 5 attempts."
                exit 1
              fi
              echo "Push attempt $attempt failed; syncing main and retrying..."
              sleep $((attempt * 5))
              git fetch origin main
              git rebase origin/main
            done
          fi
